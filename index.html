<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xursanoy — Bahorgi Kayfiyat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(167, 243, 208, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(253, 230, 138, 0.7) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(110, 231, 183, 0.7) 0%, transparent 45%),
        linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #fef9c3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #14532d;
    }

    .card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 490px;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(21, 128, 61, 0.16);
      border: 1px solid rgba(134, 239, 172, 0.75);
    }

    .name-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #14532d;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #4d7c0f;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: 14px;
      font-size: 15px;
      color: #14532d;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder {
      color: #65a30d;
    }

    input:focus {
      background: #ffffff;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #16a34a 0%, #0d9488 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.25);
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #15803d;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #dcfce7;
    }

    ul {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      align-items: center;
      gap: 12px;
