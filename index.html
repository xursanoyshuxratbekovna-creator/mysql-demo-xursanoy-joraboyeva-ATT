<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xursanoydan Salom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      /* Atirgul rasmi foni */
      background-image: url('https://images.unsplash.com/photo-1587132137056-bfbf0166836e?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #4a0404;
    }

    /* Foni qoraytirilgan shaffof qatlam */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35); /* Yarim shaffof qora qatlam */
      z-index: 1;
    }

    .card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 490px;
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 2; /* Qatlam ustida turishi uchun */
      text-align: center;
    }

    .rose-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #991b1b; /* To'q qizil */
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 15px;
      color: #7f1d1d;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #fecaca;
      background: #fff5f5;
      border-radius: 16px;
      font-size: 15px;
      color: #7f1d1d;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #ef4444;
    }

    input:focus {
      border-color: #b91c1c;
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.15);
    }

    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(153, 27, 27, 0.3);
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(153, 27, 27, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #991b1b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #fecaca;
    }

    ul {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff5f5;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #fecaca;
      transition: transform 0.15s, background 0.2s;
      text-align: left;
    }

    li:hover {
      background: #fecaca;
      transform: translateX(3px);
    }

      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    .info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-weight: 700;
      font-size: 16px;
      color: #450a0a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    small {
      font-size: 12px;
      color: #991b1b;
      margin-top: 2px;
    }

    .empty {
      text-align: center;
      color: #991b1b;
      font-size: 14px;
      padding: 25px 0;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="card">
    <div class="rose-icon">🌹</div>
    <div class="header">
      <h1>Xursanoydan alangali salom hammaga!</h1>
      <p>Siz ham ismingizni qoldiring</p>
    </div>

    <div class="form-group">
      <input id="name" placeholder="Ismingizni yozing..." maxlength="100" onkeypress="if(event.key==='Enter') add()">
      <button id="saveBtn" onclick="add()">Saqlash</button>
    </div>

    <div class="list-header">
      <span>Saqlangan ismlar</span>
      <span id="count">0 ta</span>
    </div>

    <ul id="list">
      <div class="empty">Yuklanmoqda...</div>
    </ul>
  </div>

<script>
const API = "/.netlify/functions/api";

async function load() {
  const ul = document.getElementById("list");
  const countEl = document.getElementById("count");
  try {
    const res = await fetch(API);
    const rows = await res.json();
    ul.innerHTML = "";
    countEl.textContent = rows.length + " ta";

    if (!rows.length) {
      ul.innerHTML = '<div class="empty">Hozircha hech kim ism qoldirmagan. Birinchi bo\'ling!</div>';
      return;
    }

    rows.forEach(r => {
      const li = document.createElement("li");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = r.name.charAt(0).toUpperCase();

      const info = document.createElement("div");
      info.className = "info";

      const nameSpan = document.createElement("span");
      nameSpan.className = "user-name";
      nameSpan.textContent = r.name;

      const s = document.createElement("small");
      s.textContent = new Date(r.created_at).toLocaleString("uz-UZ");

      info.appendChild(nameSpan);
      info.appendChild(s);
      li.appendChild(avatar);
      li.appendChild(info);
      ul.appendChild(li);
    });
  } catch (e) {
    ul.innerHTML = '<div class="empty">Ma\'lumotlarni yuklashda xatolik yuz berdi.</div>';
  }
}

async function add() {
  const input = document.getElementById("name");
  const btn = document.getElementById("saveBtn");
  const name = input.value.trim();
  if (!name) return;

  btn.disabled = true;
  btn.textContent = "Saqlanmoqda...";

  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    input.value = "";
    await load();
  } finally {
    btn.disabled = false;
    btn.textContent = "Saqlash";
  }
}

load();
</script>
</body>
</html>
