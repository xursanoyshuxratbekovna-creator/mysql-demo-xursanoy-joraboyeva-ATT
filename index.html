 <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mehmonlar kitobi — MySQL Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1f2937;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: #6b7280;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
    }

    ul {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f9fafb;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #f3f4f6;
      transition: background 0.2s;
    }

    li:hover {
      background: #f3f4f6;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-weight: 600;
      font-size: 15px;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    small {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Ismingizni qoldiring</h1>
      <p>Ma'lumotlar TiDB Cloud MySQL bazasida saqlanadi</p>
    </div>

    <div class="form-group">
      <input id="name" placeholder="Ismingizni yozing..." maxlength="100" onkeypress="if(event.key==='Enter') add()">
      <button id="saveBtn" onclick="add()">Saqlash</button>
    </div>

    <div class="list-header">
      <span>Saqlangan ismlar</span>
      <span id="count">0 ta</span>
    </div>

    <ul id="list">
[24/11/2026 18:45] Jo'raboyeva Xursanoy ATT: <div class="empty">Yuklanmoqda...</div>
    </ul>
  </div>

<script>
const API = "/.netlify/functions/api";

async function load() {
  const ul = document.getElementById("list");
  const countEl = document.getElementById("count");
  try {
    const res = await fetch(API);
    const rows = await res.json();
    ul.innerHTML = "";
    countEl.textContent = rows.length + " ta";

    if (!rows.length) {
      ul.innerHTML = '<div class="empty">Hozircha hech kim ism qoldirmagan. Birinchi bo\'ling!</div>';
      return;
    }

    rows.forEach(r => {
      const li = document.createElement("li");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = r.name.charAt(0).toUpperCase();

      const info = document.createElement("div");
      info.className = "info";

      const nameSpan = document.createElement("span");
      nameSpan.className = "user-name";
      nameSpan.textContent = r.name;

      const s = document.createElement("small");
      s.textContent = new Date(r.created_at).toLocaleString("uz-UZ");

      info.appendChild(nameSpan);
      info.appendChild(s);
      li.appendChild(avatar);
      li.appendChild(info);
      ul.appendChild(li);
    });
  } catch (e) {
    ul.innerHTML = '<div class="empty">Ma\'lumotlarni yuklashda xatolik yuz berdi.</div>';
  }
}

async function add() {
  const input = document.getElementById("name");
  const btn = document.getElementById("saveBtn");
  const name = input.value.trim();
  if (!name) return;

  btn.disabled = true;
  btn.textContent = "Saqlanmoqda...";

  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    input.value = "";
    await load();
  } finally {
    btn.disabled = false;
    btn.textContent = "Saqlash";
  }
}

load();
</script>
</body>
</html>
