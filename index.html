<body>
  <div class="app-wrapper">
    <div class="top-meta">Jo'raboyeva Xursanoy ATT:</div>

    <header class="top-bar">
      <div class="brand">
        <span>🌹</span>
        <span>Atirgul Doska</span>
      </div>
      <div class="top-actions">
        <button class="btn-primary" id="newNoteBtn" type="button">+<br>Yangi Xabar</button>
        <button class="btn-secondary" id="allNotesBtn" type="button">Barcha<br>xabarlar</button>
      </div>
    </header>

    <section class="form-card" id="formCard">
      <h1>Xursanoydan alangali salom azizlar,samimiy tilaklar uchun rahmat hammaga!</h1>
      <input
        id="nameInput"
        class="note-input"
        placeholder="salom"
        maxlength="100"
      >
      <button class="save-btn" id="saveBtn" type="button">Saqlash</button>
    </section>

    <input
      id="searchInput"
      class="search-box"
      placeholder="Xabarlar ichidan qidirish..."
    >

    <main class="notes-list" id="notesList">
      <div class="empty-msg">Yuklanmoqda...</div>
    </main>
  </div>

<script>
const API = "/.netlify/functions/api";
let allNotes = [];

function pad2(num) {
  return num < 10 ? "0" + num : String(num);
}

function formatDateTime(dateStr) {
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return "";
  const dd = pad2(d.getDate());
  const mm = pad2(d.getMonth() + 1);
  const yyyy = d.getFullYear();
  const hh = pad2(d.getHours());
  const min = pad2(d.getMinutes());
  const ss = pad2(d.getSeconds());
  return dd + "/" + mm + "/" + yyyy + ", " + hh + ":" + min + ":" + ss;
}

function renderNotes() {
  const listEl = document.getElementById("notesList");
  const searchEl = document.getElementById("searchInput");
  const query = (searchEl ? searchEl.value : "").trim().toLowerCase();
  const filtered = query
    ? allNotes.filter(function (item) {
        return ((item && item.name) || "").toLowerCase().indexOf(query) !== -1;
      })
    : allNotes;

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty-msg">Hech qanday xabar topilmadi.</div>';
    return;
  }

  listEl.innerHTML = "";
  filtered.forEach(function (item) {
    const card = document.createElement("article");
    card.className = "note-item";

    const title = document.createElement("div");
    title.className = "note-title";
    title.textContent = "+ " + (item.name || "");

    const timeRow = document.createElement("div");
    timeRow.className = "note-time";

    const dot = document.createElement("span");
    dot.className = "clock-dot";
    dot.textContent = "◔";

    const timeText = document.createElement("span");
    timeText.textContent = formatDateTime(item.created_at);

    timeRow.appendChild(dot);
    timeRow.appendChild(timeText);
    card.appendChild(title);
    card.appendChild(timeRow);
    listEl.appendChild(card);
  });
}

async function loadNotes() {
  const listEl = document.getElementById("notesList");
  try {
    const res = await fetch(API);
    const rows = await res.json();
    if (!Array.isArray(rows)) {
      throw new Error("Invalid response");
    }
    allNotes = rows;
    renderNotes();
  } catch (err) {
    listEl.innerHTML = '<div class="empty-msg">Ma\'lumotlarni yuklashda xatolik yuz berdi.</div>';
  }
}

async function addNote() {
  const input = document.getElementById("nameInput");
  const btn = document.getElementById("saveBtn");
  const val = input.value.trim();
  if (!val) return;

  btn.disabled = true;
  btn.textContent = "Saqlanmoqda...";

  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: val })
    });
    input.value = "";
    await loadNotes();
  } finally {
    btn.disabled = false;
    btn.textContent = "Saqlash";
  }
}

document.getElementById("saveBtn").addEventListener("click", addNote);

document.getElementById("nameInput").addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    addNote();
  }
});

document.getElementById("searchInput").addEventListener("input", renderNotes);

document.getElementById("newNoteBtn").addEventListener("click", function () {
  const input = document.getElementById("nameInput");
  input.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(function () {
    input.focus();
  }, 200);
});

document.getElementById("allNotesBtn").addEventListener("click", function () {
  document.getElementById("searchInput").value = "";
  renderNotes();
});

loadNotes();
</script>
